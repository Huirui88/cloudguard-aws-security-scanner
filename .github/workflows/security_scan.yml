name: Security Scans

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bandit (SAST)
        # This scans your source code for security flaws
        run: bandit -r ./cloudguard-compliance-scanner

      - name: Run Safety (SCA)
        # This checks your installed packages for known CVEs
        # Note: Safety 3.x may require an API key for private use
        run: safety scan
